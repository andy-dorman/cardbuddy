; cardbuddy: fm1buddy's core (lib fm1core) on the M5 Cardputer (ADV): pio run -t upload
;
; the core comes from fm1buddy beside this repo (../fm1buddy) for now: CI checks it out there too

[platformio]
default_envs = cardputer

[env:cardputer]
; the same platform as fm1buddy (Arduino 3, TinyUSB host later)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; 8 MB, two app slots: M5 Launcher puts it in its own slot instead (firmware.bin, the app alone)
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    '-D FM1BUDDY_BIN="cardbuddy.bin"'
    -D SCREEN_W=240
    -D SCREEN_H=135
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    bblanchon/ArduinoJson@7.2.1
    fm1core=symlink://../fm1buddy/lib/fm1core
